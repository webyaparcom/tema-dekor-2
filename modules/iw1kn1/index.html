  .modulex-deger-kat-plani { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }

  .modulex-deger-kat-plani-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }

  .modulex-deger-kat-plani-duzen { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: start; }

  .modulex-deger-kat-plani-kuzey { position: absolute; inset-block-start: 12px; inset-inline-end: 16px; color: --accentInk--; }
  .modulex-deger-kat-plani-kuzey .material-symbols-outlined { font-size: 26px; }
  .modulex-deger-kat-plani-plan { display: flex; flex-wrap: wrap; padding: 1.5px; border: 5px solid --text--; background: color-mix(in srgb, --bg-- 70%, transparent); }
  .modulex-deger-kat-plani-oda { position: relative; flex: 1 1 30%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-content: space-between; justify-items: start; gap: 14px; min-height: 150px; margin: -1.5px; padding: 16px 18px; border: 3px solid --text--; border-radius: 0; background-color: transparent; color: --text--; font: inherit; text-align: start; transition: background-color 0.3s ease, color 0.3s ease; }
  .modulex-deger-kat-plani-oda--0 { flex-basis: 52%; min-height: 190px; }
  .modulex-deger-kat-plani-oda--1 { flex-basis: 40%; }
  .modulex-deger-kat-plani-oda--3 { flex-basis: 34%; }
  .modulex-deger-kat-plani-oda--4 { flex-basis: 26%; }
  .modulex-deger-kat-plani-oda--5 { flex-basis: 44%; }
  .modulex-deger-kat-plani-oda:hover { background-color: color-mix(in srgb, --accent-- 10%, --bg--); }
  .modulex-deger-kat-plani-oda[aria-pressed="true"] { background-color: color-mix(in srgb, --accent-- 16%, --bg--); background-image: repeating-linear-gradient(45deg, color-mix(in srgb, --accent-- 26%, transparent) 0 2px, transparent 2px 11px); }
  .modulex-deger-kat-plani-okod { padding: 2px 8px; border: 1.5px solid currentColor; color: --accentInk--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 0.75rem; font-weight: 700; }
  .modulex-deger-kat-plani-oad { grid-column: 1 / -1; padding: 2px 6px; background: --bg--; font-size: 0.95rem; font-weight: 800; letter-spacing: 0.05em; line-height: 1.25; text-transform: uppercase; }
  .modulex-deger-kat-plani-oikon { justify-self: end; color: --accentInk--; font-size: 26px; transition: transform 0.35s ease; }
  .modulex-deger-kat-plani-oda:hover .modulex-deger-kat-plani-oikon { transform: scale(1.15); }
  .modulex-deger-kat-plani-kapi { position: absolute; inset-block-end: 0; inset-inline-end: 26px; width: 34px; height: 34px; border-inline-start: 2px solid --text--; border-block-start: 1.5px dashed --muted--; border-start-end-radius: 100%; pointer-events: none; }
  .modulex-deger-kat-plani-olcek { position: absolute; inset-block-end: 14px; inset-inline: 26px; height: 10px; border-inline: 1.5px solid --text--; background: linear-gradient(--text--, --text--) 50% 50% / 100% 1.5px no-repeat; }
  .modulex-deger-kat-plani-lejant { display: grid; gap: 14px; }
  .modulex-deger-kat-plani-bilgi { position: relative; display: grid; gap: 10px; padding: clamp(22px, 3vw, 32px); border: 1px solid --cizgi--; border-block-start: 4px solid --text--; background: --kartBg--; animation: modulex-deger-kat-plani-ac 0.45s ease both; }
  .modulex-deger-kat-plani-kod { color: --accentInk--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 2.4rem; font-weight: 700; line-height: 1; }
  .modulex-deger-kat-plani-etiket { color: --accentInk--; font-size: 0.76rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-deger-kat-plani-kbaslik { font-size: clamp(1.35rem, 2.2vw, 1.7rem); font-weight: 800; line-height: 1.2; }
  .modulex-deger-kat-plani-kmetin { color: --muted--; line-height: 1.7; }
  @keyframes modulex-deger-kat-plani-ac { from { transform: translateY(8px); clip-path: inset(0 0 100% 0); } to { transform: none; clip-path: inset(0 0 0 0); } }
  @media (max-width: 768px) {
    .modulex-deger-kat-plani-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-deger-kat-plani-cizim { padding: 40px 14px 34px; }
    .modulex-deger-kat-plani-oda, .modulex-deger-kat-plani-oda--0, .modulex-deger-kat-plani-oda--1, .modulex-deger-kat-plani-oda--3, .modulex-deger-kat-plani-oda--4, .modulex-deger-kat-plani-oda--5 { flex-basis: 45%; min-height: 118px; padding: 12px; }
    .modulex-deger-kat-plani-oad { font-size: 0.8rem; }
    .modulex-deger-kat-plani-oikon { font-size: 20px; }
  }
  .modulex-deger-kat-plani-bag { color: inherit; text-decoration: none; }
  .modulex-deger-kat-plani-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-deger-kat-plani-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-kat-plani :is(.modulex-deger-kat-plani-baslik, .modulex-deger-kat-plani-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-kat-plani-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-deger-kat-plani { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-deger-kat-plani *, .modulex-deger-kat-plani *::before, .modulex-deger-kat-plani *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-deger-kat-plani";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const secim = (s, P) => {
        const c = [...s.querySelectorAll("[data-sec]")];
        const p = [...s.querySelectorAll("[data-secim]")];
        if (!c.length) return;
        s.classList.add(P + "--js");
        const sec = (n) => {
          c.forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.sec === n)));
          p.forEach((x) => { x.hidden = x.dataset.secim !== n; });
        };
        sec(c[0].dataset.sec);
        c.forEach((x) => x.addEventListener("click", () => sec(x.dataset.sec)));
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      secim(s, P, az);
    });
  })();
</script>
